[project]
name = "finley-local"
version = "0.1.0"
description = "Local Finley intake + content screening over Gmail, with Tesseract instead of Azure Document Intelligence."
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.30",
    "pytesseract>=0.3.10",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
]

[tool.uv]
package = false

